name: Queue This Week in Rust translations

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: twir-translation-queue
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  queue:
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create tasks for untranslated issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(node scripts/twir-sync.mjs --list)
          [[ -n "$pending" ]] || exit 0

          queued=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
            --jq '.[] | select(.pull_request == null) | (.body // "") | capture("<!-- twir-translation:(?<edition>[0-9]+) -->").edition')

          while IFS=$'\t' read -r issue url; do
            if grep -Fxq -- "$issue" <<< "$queued"; then
              continue
            fi

            printf 'Оригинал: <%s>\n\nСкачать Markdown: \x60npm run twir:download -- %s\x60\n\n<!-- twir-translation:%s -->\n' "$url" "$issue" "$issue" \
              | gh issue create --repo "$GITHUB_REPOSITORY" \
                  --assignee "$GITHUB_REPOSITORY_OWNER" \
                  --title "Перевести This Week in Rust №$issue" --body-file -
          done <<< "$pending"
