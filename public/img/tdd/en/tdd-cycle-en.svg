<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tdd-cycle-title tdd-cycle-desc"><title id="tdd-cycle-title">TDD Cycle</title><desc id="tdd-cycle-desc">New behavior passes through expected test failure, implementation, and post-refactoring checks; failure returns to the corresponding step.</desc><defs>
    <style type="text/css"><![CDATA[
    text { font-family: 'Cascadia Code', Consolas, monospace; fill: #f9fafb; }
    .name { font-size: 12px; font-weight: 600; }
    .sub { font-size: 9px; fill: #d1d5db; }
    .tag { font-size: 8px; fill: #22d3ee; }
    .edge-label { font-size: 8px; fill: #d1d5db; }
    .group { font-size: 14px; font-weight: 600; }
    .legend { font-size: 10px; fill: #d1d5db; }
    .box { fill: #111827; stroke: #94a3b8; stroke-width: 1.5; }
    .focal { fill: #083344; stroke: #22d3ee; stroke-width: 1.5; }
    .edge { fill: none; stroke: #d1d5db; stroke-width: 1.5; marker-end: url(#arrow); }
    .return { stroke-dasharray: 5 4; }
    .rule { stroke: #374151; stroke-width: 1; }
    ]]></style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d1d5db"/></marker></defs><rect width="720" height="840" fill="#0a0a0a"/><line x1="360" y1="112" x2="360" y2="136" class="edge"/><line x1="360" y1="232" x2="360" y2="280" class="edge"/><line x1="360" y1="352" x2="360" y2="376" class="edge"/><line x1="360" y1="472" x2="360" y2="520" class="edge"/><line x1="360" y1="592" x2="360" y2="616" class="edge"/><path d="M248 184 H88 Q80 184 80 176 V88 Q80 80 88 80 H224" class="edge return"/><path d="M472 424 H632 Q640 424 640 416 V328 Q640 320 632 320 H496" class="edge return"/><path d="M248 664 H88 Q80 664 80 656 V568 Q80 560 88 560 H224" class="edge return"/><path d="M360 712 V744 Q360 752 368 752 H680 Q688 752 688 744 V28 Q688 20 680 20 H368 Q360 20 360 28 V40" class="edge return"/><rect x="364" y="248" width="76" height="16" fill="#0a0a0a"/><text x="402" y="258" class="edge-label" text-anchor="middle">YES</text><rect x="364" y="488" width="76" height="16" fill="#0a0a0a"/><text x="402" y="498" class="edge-label" text-anchor="middle">YES</text><rect x="90" y="156" width="76" height="16" fill="#0a0a0a"/><text x="128" y="166" class="edge-label" text-anchor="middle">NO</text><rect x="546" y="396" width="76" height="16" fill="#0a0a0a"/><text x="584" y="406" class="edge-label" text-anchor="middle">NO</text><rect x="90" y="636" width="76" height="16" fill="#0a0a0a"/><text x="128" y="646" class="edge-label" text-anchor="middle">NO</text><rect x="380" y="724" width="76" height="16" fill="#0a0a0a"/><text x="418" y="734" class="edge-label" text-anchor="middle">YES</text><rect x="224" y="40" width="272" height="72" rx="6" class="box"/><text x="240" y="57" class="tag" text-anchor="start">RED</text><text x="360" y="78" class="name" text-anchor="middle">Write and run test</text><text x="360" y="96" class="sub" text-anchor="middle">Single next behavior</text><path d="M360 136 L472 184 L360 232 L248 184 Z" class="box"/><text x="360" y="180" class="name" text-anchor="middle">Did test fail</text><text x="360" y="198" class="name" text-anchor="middle">as expected?</text><rect x="224" y="280" width="272" height="72" rx="6" class="box"/><text x="240" y="297" class="tag" text-anchor="start">GREEN</text><text x="360" y="318" class="name" text-anchor="middle">Add implementation</text><text x="360" y="336" class="sub" text-anchor="middle">Run new and existing tests</text><path d="M360 376 L472 424 L360 472 L248 424 Z" class="box"/><text x="360" y="420" class="name" text-anchor="middle">Do all tests</text><text x="360" y="438" class="name" text-anchor="middle">pass?</text><rect x="224" y="520" width="272" height="72" rx="6" class="focal"/><text x="240" y="537" class="tag" text-anchor="start">REFACTOR</text><text x="360" y="558" class="name" text-anchor="middle">Simplify if needed</text><text x="360" y="576" class="sub" text-anchor="middle">Run tests after changes</text><path d="M360 616 L472 664 L360 712 L248 664 Z" class="box"/><text x="360" y="660" class="name" text-anchor="middle">Do tests still</text><text x="360" y="678" class="name" text-anchor="middle">pass?</text><line x1="40" y1="784" x2="680" y2="784" class="rule"/><text x="40" y="808" class="legend" text-anchor="start">Dashed: return to step. After Refactor, pick the next example.</text></svg>