<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tdd-example-title tdd-example-desc"><title id="tdd-example-title">テスト例がレクサーを進化させる流れ</title><desc id="tdd-example-desc">初期の定数返却から、新規テストにより数値の読み取り、プラス記号の認識、空白のスキップへと実装が進みます。</desc><defs>
    <style type="text/css"><![CDATA[
    text { font-family: 'Cascadia Code', Consolas, monospace; fill: #f9fafb; }
    .name { font-size: 12px; font-weight: 600; }
    .sub { font-size: 9px; fill: #d1d5db; }
    .tag { font-size: 8px; fill: #22d3ee; }
    .edge-label { font-size: 8px; fill: #d1d5db; }
    .group { font-size: 14px; font-weight: 600; }
    .legend { font-size: 10px; fill: #d1d5db; }
    .box { fill: #111827; stroke: #94a3b8; stroke-width: 1.5; }
    .focal { fill: #083344; stroke: #22d3ee; stroke-width: 1.5; }
    .edge { fill: none; stroke: #d1d5db; stroke-width: 1.5; marker-end: url(#arrow); }
    .return { stroke-dasharray: 5 4; }
    .rule { stroke: #374151; stroke-width: 1; }
    ]]></style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d1d5db"/></marker></defs><rect width="720" height="560" fill="#0a0a0a"/><line x1="332" y1="112" x2="388" y2="112" class="edge"/><line x1="524" y1="156" x2="524" y2="212" class="edge"/><path d="M388 256 H332" class="edge"/><line x1="196" y1="300" x2="196" y2="356" class="edge"/><line x1="332" y1="400" x2="388" y2="400" class="edge"/><text x="40" y="36" class="legend" text-anchor="start">単一の数値解析からトークン列の処理へ。</text><rect x="60" y="68" width="272" height="88" rx="6" class="box"/><text x="80" y="88" class="tag" text-anchor="start">01 · 新規テスト</text><text x="196" y="114" class="name" text-anchor="middle">"3" → [NUMBER(3)]</text><text x="196" y="136" class="sub" text-anchor="middle">定数 NUMBER(12) では不合格</text><rect x="388" y="68" width="272" height="88" rx="6" class="box"/><text x="408" y="88" class="tag" text-anchor="start">実装</text><text x="524" y="114" class="name" text-anchor="middle">数字の読み取り</text><text x="524" y="136" class="sub" text-anchor="middle">"12" と "3" のテストが通過</text><rect x="388" y="212" width="272" height="88" rx="6" class="box"/><text x="408" y="232" class="tag" text-anchor="start">02 · 新規テスト</text><text x="524" y="258" class="name" text-anchor="middle">"12+3" → 3つのトークン</text><text x="524" y="280" class="sub" text-anchor="middle">プラス記号でエラー発生</text><rect x="60" y="212" width="272" height="88" rx="6" class="box"/><text x="80" y="232" class="tag" text-anchor="start">実装</text><text x="196" y="258" class="name" text-anchor="middle">PLUS トークンを追加</text><text x="196" y="280" class="sub" text-anchor="middle">既存テストも引き続き通過</text><rect x="60" y="356" width="272" height="88" rx="6" class="box"/><text x="80" y="376" class="tag" text-anchor="start">03 · 新規テスト</text><text x="196" y="402" class="name" text-anchor="middle">"12 + 3" → 同一トークン</text><text x="196" y="424" class="sub" text-anchor="middle">空白文字でエラー発生</text><rect x="388" y="356" width="272" height="88" rx="6" class="focal"/><text x="408" y="376" class="tag" text-anchor="start">実装</text><text x="524" y="402" class="name" text-anchor="middle">空白をスキップ</text><text x="524" y="424" class="sub" text-anchor="middle">既存テストも引き続き通過</text><line x1="40" y1="484" x2="680" y2="484" class="rule"/><text x="40" y="508" class="legend" text-anchor="start">各新規テストは過去のテストに累積されます。</text><text x="40" y="528" class="legend" text-anchor="start">リファクタリングは独立：新たな振る舞いは追加しません。</text></svg>